name: Architecture phase session
on:
  push:
    branches: [feature/architecture-fact-layer]
    paths: [.github/workflows/architecture-phase-session.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export only this review branch and pinned source history
        run: git bundle create /tmp/cortex-phase-source.bundle HEAD
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: cortex-phase-source
          path: /tmp/cortex-phase-source.bundle
          retention-days: 1
