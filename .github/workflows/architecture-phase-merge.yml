name: Architecture phase base alignment
on:
  push:
    branches: [feature/architecture-phase-dispatch]
    paths: [.github/workflows/architecture-phase-merge.yml]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve both independently added changelog entries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          baseline = '0d15f2b814ae0e5826b9c7482786a528a7fa1eb2'
          incoming = '1a2b4fa9c77ecaf618590f0812d8c9d05881af57'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True, encoding='utf-8')
          allowed = {'CHANGELOG.md', 'changelog.d/888-agy-gemini-schema.md',
                     'openspec/specs/fix-agy-reviewer-json-schema/spec.md',
                     'paulsha_cortex/coordinator/launcher.py',
                     'paulsha_cortex/coordinator/manager.py',
                     'tests/test_agy_reviewer_json_schema_880.py'}
          assert set(git('diff', '--name-only', baseline, incoming).splitlines()) == allowed
          base = git('show', baseline + ':CHANGELOG.md')
          ours = git('show', 'HEAD:CHANGELOG.md')
          theirs = git('show', incoming + ':CHANGELOG.md')
          marker = '## [Unreleased]\n'
          prefix, suffix = base.split(marker, 1)
          def addition(text):
              start, tail = text.split(marker, 1)
              assert start == prefix and tail.endswith(suffix)
              extra = tail[:-len(suffix)]
              assert extra and len(extra) < 4096
              return extra
          combined = prefix + marker + addition(ours) + addition(theirs) + suffix
          merge = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', incoming])
          assert merge.returncode in (0, 1)
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          assert conflicts in ([], ['CHANGELOG.md']), conflicts
          Path('CHANGELOG.md').write_text(combined, encoding='utf-8')
          subprocess.run(['git', 'add', '--', 'CHANGELOG.md'], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) <= allowed
          assert not git('diff', '--name-only', '--diff-filter=U').strip()
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          current = git('ls-remote', 'origin', 'refs/heads/feature/architecture-phase-dispatch').split()[0]
          assert current == os.environ['GITHUB_SHA'], 'Concurrent branch update; do not overwrite'
          subprocess.run(['git', 'commit', '-m', 'chore: 合入 main 並保留架構與 AGY 的 changelog'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feature/architecture-phase-dispatch'], check=True)
          print('Aligned document HEAD:', git('rev-parse', 'HEAD').strip())
          PY
