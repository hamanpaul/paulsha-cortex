name: Architecture review session
on:
  push:
    branches: [feature/architecture-fact-layer]
    paths: [.github/workflows/architecture-review-session.yml]
permissions:
  contents: write
jobs:
  apply-reviewed-docs:
    if: github.ref == 'refs/heads/feature/architecture-fact-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact locally validated documentation changes with preimage checks
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          root=Path('.github/architecture-session')
          m=json.loads((root/'manifest.json').read_text())
          allowed={'CHANGELOG.md','README.md','changelog.d/architecture-fact-layer.md','docs/architecture/architecture.html','docs/architecture/architecture.json','docs/architecture/facts.json','tests/architecture_browser_review.py','tests/test_architecture_docs.py'}
          assert set(m['files'])==allowed
          subprocess.run(['git','merge-base','--is-ancestor',m['base'],'HEAD'],check=True)
          for name,row in m['files'].items():
              path=Path(name)
              assert not path.is_symlink()
              before=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert before==row['old_sha256'], 'concurrent change: '+name
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text() for p in sorted(root.glob('part-*.txt')))))
          assert len(raw)<1000000 and hashlib.sha256(raw).hexdigest()==m['patch_sha256']
          patch=Path('/tmp/architecture-reviewed.patch');patch.write_bytes(raw)
          subprocess.run(['git','apply','--index','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed
          for name,row in m['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==row['new_sha256'], name
          PY
      - run: python -m pip install pytest==8.3.5 playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python -m pytest tests/test_architecture_docs.py -q
      - name: Open actual repository HTML through file navigation
        run: python tests/architecture_browser_review.py --html docs/architecture/architecture.html --output /tmp/architecture-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-html-review
          path: /tmp/architecture-review
          retention-days: 14
      - name: Commit only verified documentation to the existing PR branch
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: 完成 Cortex 架構與 workflow HTML 驗收介面'
          git push origin HEAD:feature/architecture-fact-layer
