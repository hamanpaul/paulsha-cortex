name: Architecture HTML
on:
  pull_request:
    paths: ['docs/architecture/**', 'tests/*architecture*', '.github/workflows/architecture-html.yml', 'README.md']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tt-a1i/archify
          ref: a07fa1d5b2a10cbea110c5a2be2817397a301cdc
          path: .archify-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: PYTHONPATH=. python -m pytest tests/test_architecture_docs.py -q
      - name: Original Archify delivery and exact checked-in HTML
        run: |
          mkdir -p /tmp/architecture-review
          node .archify-engine/archify/bin/archify.mjs deliver architecture docs/architecture/architecture.json /tmp/architecture-review/rebuilt.html --repo-root . --quality showcase --json > /tmp/architecture-review/delivery.json
          cmp docs/architecture/architecture.html /tmp/architecture-review/rebuilt.html
      - name: Original Archify file navigation and native graph interaction
        run: |
          # Use the runner's installed Chrome; do not disable AppArmor or sandbox.
          export ARCHIFY_CHROME="$(command -v google-chrome)"
          test -x "$ARCHIFY_CHROME"
          "$ARCHIFY_CHROME" --version | tee /tmp/architecture-review/native-browser-version.txt
          node .archify-engine/archify/bin/archify.mjs visual-check docs/architecture/architecture.html --json > /tmp/architecture-review/visual-check.json
          python tests/architecture_browser_review.py --html docs/architecture/architecture.html --output /tmp/architecture-review
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: architecture-native-review
          path: |
            /tmp/architecture-review
            docs/architecture/*.visual-check*
          retention-days: 14
