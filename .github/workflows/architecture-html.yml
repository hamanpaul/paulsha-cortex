name: Architecture HTML
on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - 'tests/*architecture*'
      - '.github/workflows/architecture-html.yml'
      - 'README.md'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python -m pytest tests/test_architecture_docs.py -q
      - name: Open exact repo HTML and exercise the review interface
        run: python tests/architecture_browser_review.py --html docs/architecture/architecture.html --output /tmp/architecture-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-html-review
          path: /tmp/architecture-review
          retention-days: 14
